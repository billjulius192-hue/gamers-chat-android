# Required because the androidbrowserhelper (TWA) library depends on
# AndroidX. Without this, Gradle refuses to build with an error like:
# "contains AndroidX dependencies, but the android.useAndroidX
# property is not enabled."
android.useAndroidX=true

# Recommended alongside useAndroidX -- automatically converts any
# remaining legacy support-library dependencies to their AndroidX
# equivalents, avoiding a second, similar error.
android.enableJetifier=true
