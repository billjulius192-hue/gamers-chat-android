plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamerschat.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.gamerschat.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // Using a committed, permanent debug keystore instead of letting
    // Gradle auto-generate one -- CI environments like GitHub Actions
    // are fresh every run and would otherwise generate a NEW debug
    // keystore (and therefore a new SHA-256 fingerprint) every single
    // build, silently breaking assetlinks.json verification each time.
    // This keystore is intentionally checked into the repo: debug
    // keystores are not meant to be secret (they use the well-known
    // password "android"), only release keystores need real secrecy.
    signingConfigs {
        debug {
            storeFile file("${rootDir}/keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support library -- this is what lets a
    // native Android app host and control our existing PWA inside a
    // full-screen, chrome-less browser view that looks like a real
    // installed app rather than a browser tab.
    //
    // ROOT CAUSE FOUND (confirmed via a real on-device crash log):
    // NoSuchMethodError on setLaunchHandlerClientMode -- this method
    // was added to androidx.browser specifically in version 1.9.0 as
    // part of the Launch Handler API. androidbrowserhelper's
    // LauncherActivity calls this method unconditionally, so ANY
    // version of androidx.browser below 1.9.0 will always crash here,
    // no matter which androidbrowserhelper version is used. Our
    // earlier attempts (forcing 1.8.0, then downgrading to 2.2.0)
    // were both doomed for the same underlying reason.
    //
    // The actual fix: androidx.browser 1.9.0 requires compileSdk 36,
    // which requires AGP 9.1.0+ (confirmed via Google's own AGP 8.9
    // release notes: max API 35; AGP 9.1.0 release notes: max API 36).
    // Both build.gradle (root) and gradle-wrapper.properties have been
    // updated to match. With that in place, we can use a recent,
    // properly-supported androidbrowserhelper version instead of an
    // old workaround release.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.1'

    // Explicitly pinning to the STABLE 1.9.0 release (not the alpha
    // 1.9.0-alpha04 that 2.6.1 pulls in by default) -- we need 1.9.0+
    // for setLaunchHandlerClientMode to exist at all, but there's no
    // reason to use an alpha build when a stable one is available.
    implementation 'androidx.browser:browser:1.9.0'
}
