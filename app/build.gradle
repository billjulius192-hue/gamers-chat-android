plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamerschat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gamerschat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Using a committed, permanent debug keystore instead of letting
    // Gradle auto-generate one -- CI environments like GitHub Actions
    // are fresh every run and would otherwise generate a NEW debug
    // keystore (and therefore a new SHA-256 fingerprint) every single
    // build, silently breaking assetlinks.json verification each time.
    // This keystore is intentionally checked into the repo: debug
    // keystores are not meant to be secret (they use the well-known
    // password "android"), only release keystores need real secrecy.
    signingConfigs {
        debug {
            storeFile file("${rootDir}/keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support library -- this is what lets a
    // native Android app host and control our existing PWA inside a
    // full-screen, chrome-less browser view that looks like a real
    // installed app rather than a browser tab.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.1'
}

// WORKAROUND for a confirmed bug in androidbrowserhelper 2.6.1: it
// unintentionally pulls in androidx.browser:browser:1.9.0-alpha04,
// an alpha dependency that requires compileSdk 36 and a newer AGP
// than this project uses. We don't need anything from that alpha
// version -- forcing the last stable release (1.8.0) here fixes the
// build without needing to upgrade the whole toolchain to chase an
// unstable dependency. See:
// https://github.com/GoogleChrome/android-browser-helper/issues/538
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}
