plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamerschat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gamerschat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Using a committed, permanent debug keystore instead of letting
    // Gradle auto-generate one -- CI environments like GitHub Actions
    // are fresh every run and would otherwise generate a NEW debug
    // keystore (and therefore a new SHA-256 fingerprint) every single
    // build, silently breaking assetlinks.json verification each time.
    // This keystore is intentionally checked into the repo: debug
    // keystores are not meant to be secret (they use the well-known
    // password "android"), only release keystores need real secrecy.
    signingConfigs {
        debug {
            storeFile file("${rootDir}/keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support library -- this is what lets a
    // native Android app host and control our existing PWA inside a
    // full-screen, chrome-less browser view that looks like a real
    // installed app rather than a browser tab.
    //
    // Pinned to 2.2.0 deliberately: versions 2.6.x+ pull in an alpha
    // androidx.browser dependency that requires compileSdk 36. We
    // previously tried to work around that by FORCING androidx.browser
    // down to 1.8.0 while keeping androidbrowserhelper 2.6.1 -- but
    // 2.6.1's internal code was written against the newer alpha APIs,
    // so forcing an older androidx.browser likely caused a runtime
    // failure (NoSuchMethodError or similar) the moment LauncherActivity
    // tried to actually launch the TWA. That would explain a build
    // that compiles fine but silently does nothing when the icon is
    // tapped -- no crash shown, no log entry, because the mismatch
    // happens deep inside a translucent, invisible launch step.
    //
    // 2.2.0 is a well-established, stable release from before this
    // alpha-dependency issue existed at all, so its whole dependency
    // tree is internally consistent -- no forcing required.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.2.0'
}
