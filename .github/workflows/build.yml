name: Build Gamers Chat APK

# Runs automatically every time code is pushed to main, and can also
# be triggered manually from the Actions tab in GitHub's mobile app.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # This is what makes the finished APK downloadable from your
      # phone -- after this step completes, go to the Actions tab,
      # open this run, and the APK appears under "Artifacts" at the
      # bottom of the page, ready to tap and download.
      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamers-chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
